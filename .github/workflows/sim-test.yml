name: WDA Simulator Test
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Show available runtimes
        run: xcrun simctl list runtimes
      - name: Create and boot simulator
        run: |
          RT=$(xcrun simctl list runtimes | grep -i "iOS" | tail -1 | sed -E "s/.*(com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS-[0-9-]+).*/\\1/")
          echo "使用运行时: $RT"
          UDID=$(xcrun simctl create "WDA-Test" "iPhone 14" "$RT")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          sleep 25
          xcrun simctl list devices | grep Booted
      - name: Clone WDA
        run: |
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          git submodule update --init --recursive
      - name: Build for testing
        run: |
          cd WebDriverAgent
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 2>&1 | tail -25
      - name: Find and install app
        run: |
          APP=$(find WebDriverAgent/build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "App 路径: $APP"
          if [ -z "$APP" ]; then echo "❌ 未找到产物"; find WebDriverAgent/build -name "*.app" | head; exit 1; fi
          xcrun simctl install "$UDID" "$APP" && echo "✅ 安装成功"
      - name: Launch and verify
        run: |
          echo "===== 启动 WDA ====="
          timeout 40 xcrun simctl launch --console "$UDID" com.facebook.WebDriverAgentRunner 2>&1 | head -50 || true
          echo "===== 检查进程 ====="
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i webdriver && echo "✅✅ WDA 进程存活" || echo "⚠️ 进程未找到"
          echo "===== 尝试访问 WDA 端口 ====="
          xcrun simctl spawn "$UDID" curl -s http://localhost:8100/status 2>/dev/null | head -5 || echo "（模拟器内无法直接 curl，正常）"
      - name: Collect crash logs
        if: always()
        run: |
          echo "===== 崩溃日志 ====="
          find ~/Library/Logs/DiagnosticReports -name "*WebDriver*" 2>/dev/null | head -5
          for f in $(find ~/Library/Logs/DiagnosticReports -name "*WebDriver*" 2>/dev/null | head -2); do
            echo "--- $f ---"
            head -80 "$f"
          done
          echo "===== 系统日志 ====="
          xcrun simctl spawn "$UDID" log show --last 3m 2>/dev/null | grep -i webdriver | tail -40 || true
