name: Build WDA (iOS 16 compatible)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Pull the WebDriverAgent source code
        run: |
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          git submodule update --init --recursive
      - name: Build for generic iOS device (unsigned, no dSYM)
        run: |
          cd WebDriverAgent
          xcodebuild build \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            IPHONEOS_DEPLOYMENT_TARGET=12.0
      - name: Package ipa (strip dSYM)
        run: |
          APP=$(find WebDriverAgent/build -path "*Release-iphoneos*" -name "*.app" | head -1)
          echo "Found app: $APP"
          find "$APP" -name "*.dSYM" -type d -exec rm -rf {} + || true
          find "$APP" -name "*.dSYM" -type f -delete || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgent.ipa Payload
          cp WebDriverAgent.ipa WebDriverAgent.tipa
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: |
            WebDriverAgent.ipa
            WebDriverAgent.tipa
          if-no-files-found: error
